<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three Ages — review workbench</title>
  <style>
    :root { font: 16px/1.45 system-ui, sans-serif; color: #20252b; background: #faf9f7; }
    body { max-width: 1180px; margin: 0 auto; padding: 1.5rem; }
    header { display: flex; justify-content: space-between; gap: 1rem; align-items: start; flex-wrap: wrap; }
    h1 { margin: 0; } .muted { color: #68717a; }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 1rem; margin-top: 1rem; }
    nav, main, .card { background: white; border: 1px solid #e1e5e8; border-radius: 8px; padding: 1rem; }
    nav { align-self: start; position: sticky; top: 1rem; }
    button, select, textarea, input { font: inherit; }
    button { border: 1px solid #c9b6bd; background: white; border-radius: 6px; padding: .5rem .7rem; cursor: pointer; }
    button:hover, button.active { background: #f1e9ec; border-color: #8b3f55; }
    .case-button { display: block; width: 100%; text-align: left; margin: .35rem 0; }
    .case-button small { display: block; color: #68717a; }
    .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .review-card { margin: 1rem 0; }
    .review-card h3 { margin-top: 0; }
    .field { margin: .8rem 0; } label { display: block; font-weight: 650; margin-bottom: .25rem; }
    textarea, input, select { box-sizing: border-box; width: 100%; padding: .55rem; border: 1px solid #bfc7cc; border-radius: 5px; }
    textarea { min-height: 6rem; resize: vertical; }
    .evidence { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .7rem; }
    figure { margin: 0; } figure img { width: 100%; max-height: 190px; object-fit: contain; background: #eee; border-radius: 4px; }
    .notice { padding: .7rem; background: #fff5d6; border-left: 4px solid #c99300; margin: .8rem 0; }
    .success { color: #176b3a; } .danger { color: #9a2838; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Three Ages review workbench</h1><p class="muted">Review source evidence without editing CSV by hand. Drafts stay in this browser until exported.</p></div>
    <div><label for="sessionReviewer">Reviewer</label><input id="sessionReviewer" placeholder="Your name" autocomplete="name"><label><input id="blindVisualReview" type="checkbox" checked> Blind visual review (hide source descriptions)</label><div class="actions"><button id="clearDrafts">Clear local drafts</button><button id="exportSession">Export review session</button><button id="exportAll">Export all worksheets</button></div></div>
  </header>
  <div id="status" class="muted">Loading review data…</div>
  <div class="layout">
    <nav><strong>Facade review cases</strong><div id="caseList"></div></nav>
    <main id="workspace"><p class="muted">Choose a case.</p></main>
  </div>
<script>
'use strict';
const DATA='data/';
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeAsset=value=>{const s=String(value||'');return /^data\/(?:historical\/|structural\/)?[A-Za-z0-9._-]+$/.test(s)&&!s.includes('/.')&&!s.includes('/..')?s:''};
const safeUrl=value=>{try{const u=new URL(String(value));return u.protocol==='https:'?u.href:'#'}catch{return '#'}};
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell='';continue}cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const headers=rows.shift()||[];return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]||''])))}
function csvCell(value){const s=String(value??'');return /[",\n\r]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
function toCSV(rows){if(!rows.length)return '';const headers=Object.keys(rows[0]);return [headers.join(','),...rows.map(r=>headers.map(h=>csvCell(r[h])).join(','))].join('\n')+'\n'}
const storeKey='three-ages-review-drafts-v1';
const reviewerKey='three-ages-reviewer-v1';
let data={pilot:null,supplement:null,buildings:new Map(),register:[],image:[],structural:[]};let selected='005';let kind='register';
let drafts=JSON.parse(localStorage.getItem(storeKey)||'{}');
function key(type,row){return `${type}:${row.source_id}:${row.asset_id||row.comparison_id||row.claim_id}`}
function immutable(type,row){const fields=type==='image'?['source_id','facade_unit_id','asset_id','epoch','source_url','image_url','preview','preview_sha256','licence','credit','source_style_text']:type==='structural'?['source_id','comparison_id','area_asset_ids','area_epochs','area_previews','area_preview_sha256','case_crop_previews','case_crop_pixel_sha256']:['source_id','claim_id','reported_value','date_semantics','source_comparison','source_kind','source_record_id','source_url'];return fields.map(f=>`${f}=${row[f]||''}`).join('|')}
function values(type,row){const saved=drafts[key(type,row)];return saved&&saved.fingerprint===immutable(type,row)?saved.fields:{}}
function setField(type,row,name,value){if(!row)return;const k=key(type,row);const current=values(type,row);drafts[k]={fingerprint:immutable(type,row),fields:{...current,[name]:value}};localStorage.setItem(storeKey,JSON.stringify(drafts));$('status').textContent=`${Object.keys(drafts).length} local draft(s) saved. Changes are not in repository files until exported.`}
function record(type){return data[type].find(r=>key(type,r)===key(type,data[type].find(x=>key(type,x)===`${type}:${selected}:${type==='image'?'':type==='structural'?'grand-place-1930-1935-to-2022':'register-'+selected}`)||{}))}
function currentRows(){return data[kind].filter(r=>r.source_id===selected)}
function complete(type,row){const v={...row,...values(type,row)};const metadata=['reviewer','reviewed_at','confidence'];if(metadata.some(f=>!String(v[f]||'').trim()))return false;if(type==='register')return Boolean(String(v.register_decision||'').trim()&&String(v.register_observation||'').trim());if(type==='image'){const facadeObservation=String(v.facade_observation||'').trim();return Boolean((facadeObservation&&String(v.facade_style||'').trim())||String(v.structural_observation||'').trim())}return Boolean(String(v.structural_observation||'').trim())}
function progress(type){return `${data[type].filter(row=>complete(type,row)).length}/${data[type].length}`}
function nextIncomplete(){for(const type of ['register','image','structural']){const row=data[type].find(item=>!complete(type,item));if(row){selected=row.source_id;kind=type;render();return}}$('status').innerHTML='<span class="success">All review rows are complete.</span>'}
function field(type,row,name,label,extra=''){const v=values(type,row)[name]??row[name]??'';return `<div class="field"><label for="${escapeHTML(key(type,row)+'-'+name)}">${label}</label>${extra||`<textarea id="${escapeHTML(key(type,row)+'-'+name)}" data-type="${type}" data-key="${escapeHTML(key(type,row))}" data-field="${name}">${escapeHTML(v)}</textarea>`}</div>`}
function selectField(type,row,name,label,options){const v=values(type,row)[name]??row[name]??'';return `<div class="field"><label>${label}</label><select data-type="${type}" data-key="${escapeHTML(key(type,row))}" data-field="${name}"><option value="">Choose…</option>${options.map(o=>`<option ${v===o?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select></div>`}
function sourceCard(row){return `<p><b>${escapeHTML(row.name||'')}</b> · ${escapeHTML(row.address||'')} · <a href="${safeUrl(row.source_url)}" target="_blank" rel="noopener">open source</a></p>`}
function renderCard(type,row){const v=values(type,row);let content=type==='image'&&$('blindVisualReview').checked?'<p class="muted">Blind visual review: source identity and descriptions hidden.</p>':sourceCard(row);if(type==='register'){ content+=`<p>${escapeHTML(row.source_note||'')}</p>${row.identity_note?`<div class="notice">${escapeHTML(row.identity_note)}</div>`:''}${row.identity_gate&&row.identity_gate!=='not applicable'?(selectField(type,row,'identity_gate','Identity gate (confirm the crosswalk before interpreting images)',['pending','confirmed','confirmed with qualification','not confirmed'])+field(type,row,'identity_gate_note','Identity gate rationale (required to resolve the gate)')):''}${selectField(type,row,'register_decision','Decision',['accept proxy for MVP','retain as reconstruction evidence','reject source mapping'])}${field(type,row,'register_observation','Review observation')}`}if(type==='image'){content+=`<p>${!$('blindVisualReview').checked?escapeHTML(row.source_observation||'')+' · ':''}${escapeHTML(row.licence)} · ${escapeHTML(row.credit)}</p>${!$('blindVisualReview').checked&&row.source_style_text?`<p><b>${row.source_label_kind==="curated source-described style"?"Source-described style label:":"Source-described facade text:"}</b> ${escapeHTML(row.source_style_text)} <span class="muted">(source text, not a reviewer visual label)</span></p>`:''}<div class="evidence"><figure><img src="${safeAsset(row.preview)}" alt="${escapeHTML(row.epoch)} source preview"><figcaption>${escapeHTML(row.epoch)}</figcaption></figure></div>${row.facade_unit_id&&!$('blindVisualReview').checked?`<p class="muted">Facade unit: <b>${escapeHTML(row.facade_unit_id)}</b>${unitRecordCount(row.facade_unit_id)>1?` — this unit spans ${unitRecordCount(row.facade_unit_id)} City records and one designed facade; review it once, as a unit.`:""}</p>`:""}${!$('blindVisualReview').checked&&row.identity_note?`<div class="notice">${escapeHTML(row.identity_note)}</div>`:''}<p class="muted">Choose the primary style you perceive from this image, not the source-described style. Use Mixed, Uncertain, or Not assessable when appropriate.</p>${selectField(type,row,'facade_style','Primary perceived facade style',['baroque','classical french','renaissance-inspired','mixed','other','uncertain','not assessable'])}${field(type,row,'facade_observation','Facade observation')}${field(type,row,'structural_observation','Structural observation')}`}if(type==='structural'){const previews=(row.case_crop_previews||'').split(';');content+=`<p>${escapeHTML(row.source_observation||'')}</p><div class="evidence">${previews.map((p,i)=>`<figure><img src="${safeAsset(p)}" alt="structural crop ${i+1}"><figcaption>Epoch ${escapeHTML((row.area_epochs||'').split(';')[i]||'')}</figcaption></figure>`).join('')}</div>${row.identity_note?`<div class="notice">${escapeHTML(row.identity_note)}`:''}${field(type,row,'structural_observation','Structural comparison observation')}`}content+=selectField(type,row,'confidence','Confidence',['low','medium','high'])+field(type,row,'reviewer','Reviewer',`<input data-type="${type}" data-key="${escapeHTML(key(type,row))}" data-field="reviewer" value="${escapeHTML(v.reviewer??row.reviewer??'')}>`)+field(type,row,'reviewed_at','Reviewed at (ISO date)',`<input type="date" data-type="${type}" data-key="${escapeHTML(key(type,row))}" data-field="reviewed_at" value="${escapeHTML(v.reviewed_at??row.reviewed_at??'')}>`);return `<section class="card review-card"><h3>${type==='image'?'Image':type==='structural'?'Structural comparison':'Register'} review</h3>${content}</section>`}
function render(){const rows=currentRows();const cases=[...new Set(['register','image','structural'].flatMap(k=>data[k].map(r=>r.source_id)))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));$('caseList').innerHTML=cases.map(sourceId=>{const c=data.buildings.get(String(sourceId))||{};const blinded=kind==='image'&&$('blindVisualReview').checked;return `<button class="case-button ${sourceId===selected?'active':''}" data-case="${sourceId}">${blinded?`Case ${escapeHTML(sourceId)}`:escapeHTML(c.name||sourceId)}${blinded?'':`<small>${escapeHTML(c.address||'')}</small>`}</button>`}).join('');const tabs=['register','image','structural'].map(t=>`<button class="${kind===t?'active':''}" data-kind="${t}">${t==='image'?'Facade images':t==='structural'?'Structural crops':'Register semantics'} (${progress(t)})</button>`).join('');$('workspace').innerHTML=`<div class="tabs">${tabs}<button data-next-incomplete>Next incomplete row</button></div>${gateBlocked(selected)&&kind!=='register'?`<div class="notice"><b>Identity gate unresolved (${escapeHTML(identityGate(selected))}):</b> resolve the identity gate on the Register semantics tab before assigning image observations. The exporter refuses to record image reviews for this building until then.</div>`:''}${rows.length?rows.map(r=>renderCard(kind,r)).join(''):'<p class="muted">No review row for this case.</p>'}`;$('status').textContent=`${Object.keys(drafts).length} local draft(s) saved · register ${progress('register')} · images ${progress('image')} · structural ${progress('structural')}. Changes are not in repository files until exported.`}
function attach(){const reviewer=$('sessionReviewer');reviewer.value=localStorage.getItem(reviewerKey)||'';const blind=$('blindVisualReview');blind.checked=localStorage.getItem('three-ages-blind-visual-review')!=='false';blind.addEventListener('change',()=>{localStorage.setItem('three-ages-blind-visual-review',String(blind.checked));render()});reviewer.addEventListener('input',()=>{localStorage.setItem(reviewerKey,reviewer.value);if(!reviewer.value.trim())return;for(const type of ['register','image','structural'])for(const row of data[type]){if(!String(values(type,row).reviewer??row.reviewer??'').trim())setField(type,row,'reviewer',reviewer.value.trim())}});document.body.addEventListener('click',e=>{const c=e.target.closest('[data-case]');if(c){selected=c.dataset.case;render();return}const t=e.target.closest('[data-kind]');if(t){kind=t.dataset.kind;render();return}if(e.target.id==='clearDrafts'){if(confirm('Clear all local review drafts?')){drafts={};localStorage.removeItem(storeKey);render()}}if(e.target.id==='exportSession')exportSession();if(e.target.id==='exportAll')exportAll();if(e.target.closest('[data-next-incomplete]'))nextIncomplete()});document.body.addEventListener('input',e=>{if(e.target.dataset.field)setField(e.target.dataset.type,data[e.target.dataset.type].find(r=>key(e.target.dataset.type,r)===e.target.dataset.key),e.target.dataset.field,e.target.value)});document.body.addEventListener('change',e=>{if(e.target.dataset.field)setField(e.target.dataset.type,data[e.target.dataset.type].find(r=>key(e.target.dataset.type,r)===e.target.dataset.key),e.target.dataset.field,e.target.value)})}
function merged(type){return data[type].map(row=>({...row,...values(type,row)}))}
function identityGate(sourceId){const row=merged('register').find(r=>r.source_id===sourceId);return row?(row.identity_gate||''):''}
function gateBlocked(sourceId){const g=identityGate(sourceId);return g==='pending'||g==='not confirmed'}
function unitRecordCount(unitId){if(!unitId)return 1;const rows=data.register.filter(r=>r.facade_unit_id===unitId);return new Set(rows.map(r=>r.source_id)).size||1}
function exportSession(){const reviewer=$('sessionReviewer').value.trim();localStorage.setItem(reviewerKey,reviewer);const records=[];for(const type of ['register','image','structural'])for(const row of data[type]){const fields=values(type,row);if(Object.keys(fields).length)records.push({type,key:key(type,row),fingerprint:immutable(type,row),source_id:row.source_id,asset_id:row.asset_id||'',comparison_id:row.comparison_id||'',claim_id:row.claim_id||'',fields})}const payload={schema_version:1,reviewer,exported_at:new Date().toISOString(),records};const href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}));$('status').innerHTML=`<span class="success">Session ready: <a href="${href}" download="three-ages-review-session.json">download review session JSON</a>. This export is independent and will not overwrite another reviewer.</span>`}
function exportAll(){const files=[['three-ages-register-review.csv',toCSV(merged('register'))],['three-ages-image-review.csv',toCSV(merged('image'))],['three-ages-structural-review.csv',toCSV(merged('structural'))]];const links=files.map(([name,text])=>{const href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));return `<a href="${href}" download="${name}">${name}</a>`}).join(' · ');$('status').innerHTML=`<span class="success">Ready to download: ${links}. Review the files and copy them over the repository worksheets.</span>`}
async function init(){const files=['three-ages-pilot.json','grand-place-buildings.json','three-ages-register-review.csv','three-ages-image-review.csv','three-ages-structural-review.csv'];const [pilot,buildings,register,image,structural]=await Promise.all(files.map(f=>fetch(DATA+f).then(r=>r.ok?r.text():Promise.reject(new Error(f+' failed')))));data.pilot=JSON.parse(pilot);JSON.parse(buildings).records.forEach(r=>data.buildings.set(String(r.id),r));data.register=parseCSV(register);data.image=parseCSV(image);data.structural=parseCSV(structural);for(const rows of [data.register,data.image,data.structural])rows.forEach(r=>{const b=data.buildings.get(r.source_id);if(b){r.name=b.name||r.name;r.address=b.address||r.address}});attach();render()}
init().catch(error=>{$('status').innerHTML=`<span class="danger">${escapeHTML(error.message)}</span>`});
</script>
</body>
</html>
